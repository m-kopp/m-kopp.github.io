<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="/">{{ .Site.Title }}</a>
            </div>
            <nav class="cool-menu">
                {{ $currentPage := . }}
                <ul>
                    {{ range .Site.Menus.main }}
                    <li><a href="{{ .URL }}" class="{{ if $currentPage.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}<span></span></a></li>
                    {{ end }}
                </ul>
            </nav>
        </div>
    </header>

    <div class="header-image" {{ with .Params.headerImage }}style="background-image: url('{{ . }}');"{{ end }}>
        <div class="header-overlay">
            <h1>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}</h1>
        </div>
    </div>

    <main>
        <div class="container">
            {{ block "main" . }}{{ end }}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }}. Alle Rechte vorbehalten.</p>
        </div>
    </footer>

    <div id="visitor-counter">
        <div class="counter-label">Besucher:</div>
        <div id="counter-value" class="counter-display">0</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let counter;
            let waitingTime = 1000; // Zeit in Millisekunden
            // waittime random between 20 and 130 seconds
            waitingTime = Math.floor(Math.random() * (130 - 20 + 1)) + 20;
            const counterDisplay = document.getElementById('counter-value');
            
            // Prüfe, ob bereits ein Zähler im localStorage existiert
            if (localStorage.getItem('visitorCounter')) {
                // Wenn ja, verwende diesen Wert
                counter = parseInt(localStorage.getItem('visitorCounter'));
            } else {
                // Wenn nicht, generiere eine zufällige Startzahl zwischen 125 und 3210
                counter = Math.floor(Math.random() * (3210 - 125 + 1)) + 125;
                // Speichere den Wert im localStorage
                localStorage.setItem('visitorCounter', counter);
            }
            
            // Zähler initial setzen
            counterDisplay.textContent = counter;
            
            // Zähler jede Sekunde erhöhen
            setInterval(function() {
                counter++;
                counterDisplay.textContent = counter;
                // Aktualisiere den Wert im localStorage
                localStorage.setItem('visitorCounter', counter);
            }, waitingTime * 1000);
        });
    </script>
</body>
</html>
