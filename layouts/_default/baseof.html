<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="/">{{ .Site.Title }}</a>
            </div>
            <nav class="cool-menu">
                {{ $currentPage := . }}
                <ul>
                    {{ range .Site.Menus.main }}
                    <li><a href="{{ .URL }}" class="{{ if $currentPage.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}<span></span></a></li>
                    {{ end }}
                </ul>
            </nav>
        </div>
    </header>

    <div class="header-image" {{ with .Params.headerImage }}style="background-image: url('{{ . }}');"{{ end }}>
        <div class="header-overlay">
            <h1>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}</h1>
        </div>
    </div>

    <main>
        <div class="container">
            {{ block "main" . }}{{ end }}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }}. Alle Rechte vorbehalten.</p>
        </div>
    </footer>

    <div id="visitor-counter">
        <div class="counter-label">Besucher:</div>
        <div id="counter-value" class="counter-display">0</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Zufällige Startzahl zwischen 125 und 3210 generieren
            let counter = Math.floor(Math.random() * (3210 - 125 + 1)) + 125;
            const counterDisplay = document.getElementById('counter-value');
            
            // Zähler initial setzen
            counterDisplay.textContent = counter;
            
            // Zähler jede Sekunde erhöhen
            setInterval(function() {
                counter++;
                counterDisplay.textContent = counter;
            }, 13000);
        });
    </script>
</body>
</html>
